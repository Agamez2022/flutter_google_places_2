name: flutter_google_places_2
description: Google places autocomplete widgets for flutter.
version: 2.0.0
publish_to: "none"

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  google_api_headers: ^5.4.3
  http: ^1.6.0
  rxdart: ^0.28.0
  rxdart_ext: ^0.4.0
  listenable_stream: ^2.0.1
  collection: ^1.19.1
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  assets:
    - packages/flutter_google_places_2/assets/google_black.png
    - packages/flutter_google_places_2/assets/google_white.png
